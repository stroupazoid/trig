<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Unit Circle</title>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #fafafa; }
    .wrap { max-width: 900px; margin: 0 auto; padding: 18px; }
    h1 { margin: 0 0 6px; }
    p { margin-top: 0; color: #444; }
    #plot { width: 100%; height: 700px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Interactive Unit Circle</h1>
    <p>Drag the angle slider or press Play.</p>
    <div id="plot"></div>
  </div>

<script>
const circleX = [], circleY = [];
for (let i = 0; i <= 360; i++) {
  const a = i * Math.PI / 180;
  circleX.push(Math.cos(a));
  circleY.push(Math.sin(a));
}

function traces(deg) {
  const a = deg * Math.PI / 180;
  const c = Math.cos(a), s = Math.sin(a);
  return [
    {x: circleX, y: circleY, mode: 'lines', name: 'Unit circle'},
    {x: [0,c], y: [0,s], mode: 'lines+markers', name: 'Radius'},
    {x: [c,c], y: [0,s], mode: 'lines', name: 'sin(θ)'},
    {x: [0,c], y: [0,0], mode: 'lines', name: 'cos(θ)'}
  ];
}

const frames = [];
for (let deg = 0; deg <= 360; deg += 5) {
  const a = deg * Math.PI / 180;
  const c = Math.cos(a), s = Math.sin(a);
  frames.push({
    name: String(deg),
    data: traces(deg),
    layout: {title: `θ = ${deg}°   cos(θ) = ${c.toFixed(3)}   sin(θ) = ${s.toFixed(3)}`}
  });
}

const steps = frames.map(f => ({
  method: 'animate',
  label: f.name + '°',
  args: [[f.name], {
    mode: 'immediate',
    frame: {duration: 0, redraw: true},
    transition: {duration: 0}
  }]
}));

const layout = {
  title: 'θ = 0°   cos(θ) = 1.000   sin(θ) = 0.000',
  xaxis: {range: [-1.25,1.25], zeroline: true},
  yaxis: {range: [-1.25,1.25], zeroline: true, scaleanchor: 'x', scaleratio: 1},
  margin: {l: 60, r: 20, t: 80, b: 120},
  sliders: [{
    active: 0,
    currentvalue: {prefix: 'Angle: '},
    pad: {t: 35},
    steps: steps
  }],
  updatemenus: [{
    type: 'buttons',
    showactive: false,
    x: 0.02,
    y: 1.13,
    buttons: [
      {
        label: '▶ Play',
        method: 'animate',
        args: [null, {
          fromcurrent: true,
          frame: {duration: 80, redraw: true},
          transition: {duration: 0}
        }]
      },
      {
        label: '❚❚ Pause',
        method: 'animate',
        args: [[null], {
          mode: 'immediate',
          frame: {duration: 0, redraw: false},
          transition: {duration: 0}
        }]
      }
    ]
  }]
};

Plotly.newPlot('plot', traces(0), layout, {responsive: true}).then(() => {
  Plotly.addFrames('plot', frames);
});
</script>
</body>
</html>
