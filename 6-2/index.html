<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>6.2 Hinged Triangle</title><style>*{box-sizing:border-box}body{margin:0;background:#eef3fa;color:#1d304c;font:16px system-ui,sans-serif;padding:22px}main{max-width:940px;margin:auto}header{padding:10px 0}.eyebrow{font-size:.85rem;color:#516b92;letter-spacing:.09em;text-transform:uppercase}h1{font-size:clamp(1.7rem,5vw,2.4rem);margin:8px 0}p{line-height:1.6}.sub,.small{color:#526780}.small{font-size:.9rem}.panel{background:white;border:1px solid #cbd8e9;border-radius:18px;padding:24px;margin:16px 0;box-shadow:0 8px 28px #19345c08}.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:16px 0}button,select{font:inherit;color:inherit;background:#fff;border:1px solid #b5c7df;border-radius:10px;padding:11px 15px;cursor:pointer}button:hover{background:#edf3fe}button:disabled{opacity:.45;cursor:default}.active,.primary{background:#2856ad;color:white;border-color:#2856ad}.active:hover,.primary:hover{background:#1c428c}:focus-visible{outline:3px solid #cb811e;outline-offset:3px}label{font-weight:600}select{max-width:100%;margin:8px 0}.controls{display:grid;grid-template-columns:1fr 1fr;gap:24px}input[type=range]{width:100%;margin:16px 0;accent-color:#2856ad}canvas{width:100%;height:auto;display:block}.formula{font-family:Cambria,Georgia,serif;font-size:clamp(1.2rem,3.2vw,1.6rem);line-height:1.8;overflow-wrap:anywhere}.banner{background:#eff5ff;padding:18px;border-radius:12px;margin:16px 0}.notice{padding:14px 17px;border-left:4px solid #cf8728;background:#fff7e9;border-radius:0 10px 10px 0;line-height:1.65}.steps li{padding:10px 0 10px 8px;border-bottom:1px solid #e4ebf4}.reason{color:#576b83;font: .9rem system-ui,sans-serif}.card{min-height:240px;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px;border:2px solid #c0d1e9;background:white;text-align:center}.card:hover{background:white}.good{background:#e8f5ed}.again{background:#fff0dd}.nav{justify-content:space-between}summary{cursor:pointer;font-weight:600;padding:12px 0}[hidden]{display:none!important}footer{font-size:.85rem;color:#60738d;margin:20px 0}@media(max-width:560px){body{padding:12px}.panel{padding:16px}.controls{grid-template-columns:1fr;gap:0}button{padding:10px 12px}}input[type=number]{font:inherit;padding:10px;border:1px solid #b5c7df;border-radius:9px;width:85px}.legend{display:flex;gap:18px;flex-wrap:wrap}.blue{color:#2856ad}.orange{color:#b66e17}.green{color:#208358}</style></head><body><main><header><div class="eyebrow">Trigonometry · Section 6.2</div><h1>Hinged Triangle</h1><p class="sub">Open and close a hinge. See how the opposite side changes.</p></header><div class="row"><button id="demoTab" class="active" aria-pressed="true">Explore</button><button id="cardsTab" aria-pressed="false">12 quick flashcards</button></div><section id="demo" class="panel"><div class="row"><span>Two fixed sides: a = 6, b = 8</span><button id="right">Try a right angle</button></div><label>Included angle C = <output id="angleOut"></output><input id="angle" type="range" min="15" max="165" value="60"></label><canvas id="plot" width="880" height="380" role="img" aria-label="Two fixed sides with adjustable included angle"></canvas><div id="formula" class="formula banner"></div><div id="result" class="notice" aria-live="polite"></div></section><section id="flash" class="panel" hidden><div class="row nav"><button id="prev">← Previous</button><span id="count" role="status"></span><button id="next">Next →</button></div><button id="card" class="card"><span id="face" class="small"></span><span id="cardText" class="formula"></span><span id="hint" class="small"></span></button><div class="row"><button id="flip" class="primary">Show answer</button><button id="again" class="again">Practice again</button><button id="known" class="good">Got it!</button></div><div class="row"><button id="shuffle">Shuffle</button><button id="missed">Practice missed</button><button id="reset">Start over</button></div><p id="score" class="small" aria-live="polite"></p><p class="small">No typing. No timer. Try a few cards and come back whenever you like.</p></section><footer>A few minutes of exploring is plenty. Values are rounded for display.</footer></main><script>const CARDS=[["Law of Cosines for side c?", "c² = a² + b² − 2ab cos C."], ["Which angle goes with side c?", "C, opposite c. It is also the included angle between a and b."], ["When is the Law of Cosines a natural starting point?", "SAS or SSS."], ["What happens when C = 90°?", "cos C = 0, so c² = a² + b²."], ["Sides 6 and 8 enclose a right angle. Third side?", "10."], ["Solve the Law of Cosines for cos C.", "cos C = (a² + b² − c²)/(2ab)."], ["With SSS, which angle is useful to find first?", "The angle opposite the longest side, to identify a possible obtuse angle."], ["Can sides 2, 3, and 8 form a triangle?", "No. The sum of the shorter two must exceed the longest."], ["As the included angle grows with both sides fixed, what happens to the opposite side?", "It grows."], ["If c² > a² + b², what kind of angle is C?", "Obtuse."], ["If c² < a² + b², what kind of angle is C?", "Acute."], ["Can a triangle have two obtuse angles?", "No. Its angles total 180°."]];
const $=id=>document.getElementById(id),pi=Math.PI,rad=d=>d*pi/180;
const tidy=n=>Math.abs(n)<1e-9?'0':Number(n.toFixed(4)).toString();
function piText(x){let n=Math.round(x/pi*24);if(Math.abs(x/pi-n/24)>1e-7)return tidy(x);if(!n)return '0';const gcd=(a,b)=>b?gcd(b,a%b):a,g=gcd(Math.abs(n),24),a=n/g,b=24/g;return (a<0?'−':'')+(Math.abs(a)===1?'':Math.abs(a))+'π'+(b===1?'':'/'+b)}
let timer=null;function stop(){if(timer)clearInterval(timer);timer=null;document.querySelectorAll('[data-running]').forEach(e=>{e.textContent=e.dataset.running;delete e.dataset.running})}
function start(button,fun){if(timer){stop();return}button.dataset.running=button.textContent;button.textContent='Ⅱ Pause';timer=setInterval(fun,50)}
function text(ctx,t,x,y,color='#4f6582',size=17){ctx.fillStyle=color;ctx.font=size+'px system-ui';ctx.fillText(t,x,y)}
function line(ctx,x1,y1,x2,y2,col='#c4d0e0',w=1,dash=[]){ctx.beginPath();ctx.strokeStyle=col;ctx.lineWidth=w;ctx.setLineDash(dash);ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.setLineDash([])}
function circle(id,angles){const c=$(id),ctx=c.getContext('2d'),cx=440,cy=180,R=130;ctx.clearRect(0,0,c.width,c.height);line(ctx,cx-175,cy,cx+175,cy);line(ctx,cx,cy-165,cx,cy+165);ctx.beginPath();ctx.arc(cx,cy,R,0,2*pi);ctx.strokeStyle='#c9d7e8';ctx.stroke();angles.forEach(([d,col,name],i)=>{const a=rad(d),x=cx+R*Math.cos(a),y=cy-R*Math.sin(a);line(ctx,cx,cy,x,y,col,3);ctx.beginPath();ctx.arc(cx,cy,42+i*16,0,-a,a>=0);ctx.strokeStyle=col;ctx.lineWidth=3;ctx.stroke();ctx.beginPath();ctx.arc(x,y,5,0,2*pi);ctx.fillStyle=col;ctx.fill();text(ctx,name+' = '+d+'°',25,45+i*34,col,20)});text(ctx,'1',cx+R+10,cy+20);text(ctx,'−1',cx-R-28,cy+20);text(ctx,'(1, 0)',cx+R+12,cy-12);c.setAttribute('aria-label',angles.map(([d,col,name])=>name+' '+d+' degrees').join('; '))}
function wave(id,fn,{min=-1.5,max=1.5,target=null,points=[],tracer=null,other=null}={}){const c=$(id),ctx=c.getContext('2d'),L=50,R=c.width-25,T=30,B=c.height-55,X=x=>L+x/(2*pi)*(R-L),Y=y=>B-(y-min)/(max-min)*(B-T);ctx.clearRect(0,0,c.width,c.height);for(let i=0;i<=8;i++){const x=i*pi/4;line(ctx,X(x),T,X(x),B,'#e4ebf4');if(i%2===0)text(ctx,piText(x),X(x)-12,B+28)}for(let i=0;i<=4;i++){const y=min+i*(max-min)/4;line(ctx,L,Y(y),R,Y(y),'#e4ebf4');text(ctx,tidy(y),3,Y(y)+4,'#6a7c94',13)}line(ctx,L,Y(0),R,Y(0),'#8ba0bb',2);if(target!==null)line(ctx,L,Y(target),R,Y(target),'#c47b1a',2,[7,5]);function curve(f,col,width){ctx.save();ctx.beginPath();ctx.rect(L,T,R-L,B-T);ctx.clip();ctx.beginPath();let started=false;for(let i=0;i<=900;i++){let x=i/900*2*pi,y=f(x);if(!Number.isFinite(y)||Math.abs(y)>100){started=false;continue}if(started)ctx.lineTo(X(x),Y(y));else{ctx.moveTo(X(x),Y(y));started=true}}ctx.strokeStyle=col;ctx.lineWidth=width;ctx.stroke();ctx.restore()}if(other)curve(other,'#afc0d7',5);curve(fn,'#2856ad',3);points.forEach(x=>{const y=fn(x);ctx.beginPath();ctx.arc(X(x),Y(y),7,0,2*pi);ctx.fillStyle='#208358';ctx.fill()});if(tracer!==null){ctx.beginPath();ctx.arc(X(tracer),Y(fn(tracer)),7,0,2*pi);ctx.fillStyle='#b94e4d';ctx.fill()}text(ctx,'x (radians)',R-90,c.height-7,'#536987',13)}
function showTab(cards){stop();$('demo').hidden=cards;$('flash').hidden=!cards;for(const [id,on] of [['demoTab',!cards],['cardsTab',cards]]){$(id).classList.toggle('active',on);$(id).setAttribute('aria-pressed',on)}}$('demoTab').onclick=()=>showTab(false);$('cardsTab').onclick=()=>showTab(true);
let order=CARDS.map((_,i)=>i),position=0,revealed=false,marks={};
function renderCards(){const c=CARDS[order[position]];$('face').textContent=revealed?'Answer':'Think first';$('cardText').textContent=c[revealed?1:0];$('hint').textContent=revealed?'Click to hide':'Click to reveal';$('flip').textContent=revealed?'Hide answer':'Show answer';$('known').disabled=$('again').disabled=!revealed;$('prev').disabled=position===0;$('next').disabled=position===order.length-1;$('count').textContent=(position+1)+' of '+order.length;const k=Object.values(marks).filter(v=>v==='known').length,m=Object.values(marks).filter(v=>v==='missed').length;$('score').textContent='Got it: '+k+' · Practice again: '+m;$('missed').disabled=m===0;$('card').setAttribute('aria-label',(revealed?'Answer: ':'Question: ')+$('cardText').textContent)}
function flip(){revealed=!revealed;renderCards()}function move(n){position=Math.max(0,Math.min(order.length-1,position+n));revealed=false;renderCards()}function mark(v){if(!revealed)return;marks[order[position]]=v;if(position<order.length-1){position++;revealed=false}renderCards()}
$('card').onclick=$('flip').onclick=flip;$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('known').onclick=()=>mark('known');$('again').onclick=()=>mark('missed');$('reset').onclick=()=>{order=CARDS.map((_,i)=>i);position=0;revealed=false;marks={};renderCards()};$('missed').onclick=()=>{order=CARDS.map((_,i)=>i).filter(i=>marks[i]==='missed');position=0;revealed=false;renderCards()};$('shuffle').onclick=()=>{for(let i=order.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}position=0;revealed=false;renderCards()};renderCards();

function arrow(ctx,x1,y1,x2,y2,col,width=3){line(ctx,x1,y1,x2,y2,col,width);if(Math.hypot(x2-x1,y2-y1)<.01)return;const a=Math.atan2(y2-y1,x2-x1);line(ctx,x2,y2,x2-12*Math.cos(a-.45),y2-12*Math.sin(a-.45),col,width);line(ctx,x2,y2,x2-12*Math.cos(a+.45),y2-12*Math.sin(a+.45),col,width)}
function plane(id,limit=6,labels=['x','y']){const c=$(id),ctx=c.getContext('2d'),cx=c.width/2,cy=c.height/2,S=Math.min(c.width-140,c.height-100)/(2*limit);ctx.clearRect(0,0,c.width,c.height);for(let n=-limit;n<=limit;n++){line(ctx,cx+n*S,cy-limit*S,cx+n*S,cy+limit*S,'#e3ebf5');line(ctx,cx-limit*S,cy+n*S,cx+limit*S,cy+n*S,'#e3ebf5')}line(ctx,70,cy,c.width-50,cy,'#8da2bd',2);line(ctx,cx,30,cx,c.height-35,'#8da2bd',2);text(ctx,labels[0],c.width-40,cy+6);text(ctx,labels[1],cx+9,25);text(ctx,'0',cx+7,cy+20);return {ctx,cx,cy,S,X:x=>cx+x*S,Y:y=>cy-y*S}}
function triangle(id,pts,labels){const c=$(id),ctx=c.getContext('2d');ctx.clearRect(0,0,c.width,c.height);const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]),xmin=Math.min(...xs),xmax=Math.max(...xs),ymin=Math.min(...ys),ymax=Math.max(...ys),S=Math.min((c.width-160)/(xmax-xmin||1),(c.height-110)/(ymax-ymin||1)),X=x=>80+(x-xmin)*S,Y=y=>c.height-55-(y-ymin)*S;for(let i=0;i<3;i++){const j=(i+1)%3;line(ctx,X(pts[i][0]),Y(pts[i][1]),X(pts[j][0]),Y(pts[j][1]),['#2856ad','#b97820','#208358'][i],3);text(ctx,labels[i],X(pts[i][0])+8,Y(pts[i][1])-12,'#1d304c',20)}return {ctx,X,Y}}

function cosineSide(a,b,C){return Math.sqrt(a*a+b*b-2*a*b*Math.cos(rad(C)))}function render(){const C=Number($('angle').value),c=cosineSide(6,8,C);$('angleOut').textContent=C+'°';const p=[[8,0],[6*Math.cos(rad(C)),6*Math.sin(rad(C))],[0,0]];const t=triangle('plot',p,['A','B','C = '+C+'°']);text(t.ctx,'b = 8',t.X(4)-25,t.Y(0)+30);text(t.ctx,'a = 6',t.X(p[1][0]/2)-65,t.Y(p[1][1]/2));text(t.ctx,'c ≈ '+c.toFixed(2),t.X((p[0][0]+p[1][0])/2),t.Y(p[1][1]/2)-12);$('formula').textContent='c² = a² + b² − 2ab cos C = 36 + 64 − 96 cos('+C+'°)';$('result').textContent='c ≈ '+c.toFixed(3)+(C===90?'. At 90°, cos C = 0, so this becomes the Pythagorean theorem.':'. As the included angle opens, the opposite side grows.');$('plot').setAttribute('aria-label',`Sides 6 and 8, included angle ${C} degrees, opposite side ${c.toFixed(3)}.`)}$('angle').oninput=render;$('right').onclick=()=>{$('angle').value=90;render()};render();
</script></body></html>
