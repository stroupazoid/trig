<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>5.2 Angle Mixer</title><style>*{box-sizing:border-box}body{margin:0;background:#eef3fa;color:#1d304c;font:16px system-ui,sans-serif;padding:22px}main{max-width:940px;margin:auto}header{padding:10px 0}.eyebrow{font-size:.85rem;color:#516b92;letter-spacing:.09em;text-transform:uppercase}h1{font-size:clamp(1.7rem,5vw,2.4rem);margin:8px 0}p{line-height:1.6}.sub,.small{color:#526780}.small{font-size:.9rem}.panel{background:white;border:1px solid #cbd8e9;border-radius:18px;padding:24px;margin:16px 0;box-shadow:0 8px 28px #19345c08}.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:16px 0}button,select{font:inherit;color:inherit;background:#fff;border:1px solid #b5c7df;border-radius:10px;padding:11px 15px;cursor:pointer}button:hover{background:#edf3fe}button:disabled{opacity:.45;cursor:default}.active,.primary{background:#2856ad;color:white;border-color:#2856ad}.active:hover,.primary:hover{background:#1c428c}:focus-visible{outline:3px solid #cb811e;outline-offset:3px}label{font-weight:600}select{max-width:100%;margin:8px 0}.controls{display:grid;grid-template-columns:1fr 1fr;gap:24px}input[type=range]{width:100%;margin:16px 0;accent-color:#2856ad}canvas{width:100%;height:auto;display:block}.formula{font-family:Cambria,Georgia,serif;font-size:clamp(1.2rem,3.2vw,1.6rem);line-height:1.8;overflow-wrap:anywhere}.banner{background:#eff5ff;padding:18px;border-radius:12px;margin:16px 0}.notice{padding:14px 17px;border-left:4px solid #cf8728;background:#fff7e9;border-radius:0 10px 10px 0;line-height:1.65}.steps li{padding:10px 0 10px 8px;border-bottom:1px solid #e4ebf4}.reason{color:#576b83;font: .9rem system-ui,sans-serif}.card{min-height:240px;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px;border:2px solid #c0d1e9;background:white;text-align:center}.card:hover{background:white}.good{background:#e8f5ed}.again{background:#fff0dd}.nav{justify-content:space-between}summary{cursor:pointer;font-weight:600;padding:12px 0}[hidden]{display:none!important}footer{font-size:.85rem;color:#60738d;margin:20px 0}@media(max-width:560px){body{padding:12px}.panel{padding:16px}.controls{grid-template-columns:1fr;gap:0}button{padding:10px 12px}}</style></head><body><main><header><div class="eyebrow">Trigonometry · Section 5.2</div><h1>Angle Mixer</h1><p class="sub">Mix two familiar angles to make a new one. Watch the formula agree.</p></header><div class="row"><button id="demoTab" class="active" aria-pressed="true">Mix some angles</button><button id="cardsTab" aria-pressed="false">12 quick flashcards</button></div><section id="demo" class="panel"><div class="row"><label for="fn">Function:</label><select id="fn"><option value="sin">sine</option><option value="cos">cosine</option><option value="tan">tangent</option></select><select id="sign" aria-label="Sum or difference"><option value="1">A + B</option><option value="-1">A − B</option></select></div><div class="controls"><label>A = <output id="aOut"></output><input id="a" type="range" min="0" max="180" value="45" step="5"></label><label>B = <output id="bOut"></output><input id="b" type="range" min="0" max="90" value="30" step="5"></label></div><div class="row"><button data-preset="75">Make 75°</button><button data-preset="15">Make 15°</button></div><canvas id="plot" width="880" height="360" role="img" aria-label="Angles on a unit circle"></canvas><div id="formula" class="formula banner"></div><div id="result" class="notice" aria-live="polite"></div><p id="exact" class="small"></p></section><section id="flash" class="panel" hidden><div class="row nav"><button id="prev">← Previous</button><span id="count" role="status"></span><button id="next">Next →</button></div><button id="card" class="card"><span id="face" class="small"></span><span id="cardText" class="formula"></span><span id="hint" class="small"></span></button><div class="row"><button id="flip" class="primary">Show answer</button><button id="again" class="again">Practice again</button><button id="known" class="good">Got it!</button></div><div class="row"><button id="shuffle">Shuffle</button><button id="missed">Practice missed</button><button id="reset">Start over</button></div><p id="score" class="small" aria-live="polite"></p><p class="small">No typing. No timer. Try a few cards and come back whenever you like.</p></section><footer>A few minutes of exploring is plenty. Formulas use their common domains.</footer></main><script>const CARDS=[["sin(A + B) = ?", "sin A cos B + cos A sin B"], ["sin(A − B) = ?", "sin A cos B − cos A sin B"], ["cos(A + B) = ?", "cos A cos B − sin A sin B"], ["cos(A − B) = ?", "cos A cos B + sin A sin B"], ["tan(A + B) = ?", "(tan A + tan B) / (1 − tan A tan B), wherever the expressions are defined."], ["tan(A − B) = ?", "(tan A − tan B) / (1 + tan A tan B), wherever the expressions are defined."], ["Is sin(A + B) usually sin A + sin B?", "No. Use the sum formula."], ["Which sign does cosine use for a sum?", "A minus: cos A cos B − sin A sin B."], ["A useful split for 75°?", "45° + 30°"], ["sin 75° = ?", "(√6 + √2) / 4"], ["cos 15° = ?", "(√6 + √2) / 4"], ["tan 15° = ?", "2 − √3"]];
const $=id=>document.getElementById(id),pi=Math.PI,rad=d=>d*pi/180;
const tidy=n=>Math.abs(n)<1e-9?'0':Number(n.toFixed(4)).toString();
function piText(x){let n=Math.round(x/pi*24);if(Math.abs(x/pi-n/24)>1e-7)return tidy(x);if(!n)return '0';const gcd=(a,b)=>b?gcd(b,a%b):a,g=gcd(Math.abs(n),24),a=n/g,b=24/g;return (a<0?'−':'')+(Math.abs(a)===1?'':Math.abs(a))+'π'+(b===1?'':'/'+b)}
let timer=null;function stop(){if(timer)clearInterval(timer);timer=null;document.querySelectorAll('[data-running]').forEach(e=>{e.textContent=e.dataset.running;delete e.dataset.running})}
function start(button,fun){if(timer){stop();return}button.dataset.running=button.textContent;button.textContent='Ⅱ Pause';timer=setInterval(fun,50)}
function text(ctx,t,x,y,color='#4f6582',size=17){ctx.fillStyle=color;ctx.font=size+'px system-ui';ctx.fillText(t,x,y)}
function line(ctx,x1,y1,x2,y2,col='#c4d0e0',w=1,dash=[]){ctx.beginPath();ctx.strokeStyle=col;ctx.lineWidth=w;ctx.setLineDash(dash);ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.setLineDash([])}
function circle(id,angles){const c=$(id),ctx=c.getContext('2d'),cx=440,cy=180,R=130;ctx.clearRect(0,0,c.width,c.height);line(ctx,cx-175,cy,cx+175,cy);line(ctx,cx,cy-165,cx,cy+165);ctx.beginPath();ctx.arc(cx,cy,R,0,2*pi);ctx.strokeStyle='#c9d7e8';ctx.stroke();angles.forEach(([d,col,name],i)=>{const a=rad(d),x=cx+R*Math.cos(a),y=cy-R*Math.sin(a);line(ctx,cx,cy,x,y,col,3);ctx.beginPath();ctx.arc(cx,cy,42+i*16,0,-a,a>=0);ctx.strokeStyle=col;ctx.lineWidth=3;ctx.stroke();ctx.beginPath();ctx.arc(x,y,5,0,2*pi);ctx.fillStyle=col;ctx.fill();text(ctx,name+' = '+d+'°',25,45+i*34,col,20)});text(ctx,'1',cx+R+10,cy+20);text(ctx,'−1',cx-R-28,cy+20);text(ctx,'(1, 0)',cx+R+12,cy-12);c.setAttribute('aria-label',angles.map(([d,col,name])=>name+' '+d+' degrees').join('; '))}
function wave(id,fn,{min=-1.5,max=1.5,target=null,points=[],tracer=null,other=null}={}){const c=$(id),ctx=c.getContext('2d'),L=50,R=c.width-25,T=30,B=c.height-55,X=x=>L+x/(2*pi)*(R-L),Y=y=>B-(y-min)/(max-min)*(B-T);ctx.clearRect(0,0,c.width,c.height);for(let i=0;i<=8;i++){const x=i*pi/4;line(ctx,X(x),T,X(x),B,'#e4ebf4');if(i%2===0)text(ctx,piText(x),X(x)-12,B+28)}for(let i=0;i<=4;i++){const y=min+i*(max-min)/4;line(ctx,L,Y(y),R,Y(y),'#e4ebf4');text(ctx,tidy(y),3,Y(y)+4,'#6a7c94',13)}line(ctx,L,Y(0),R,Y(0),'#8ba0bb',2);if(target!==null)line(ctx,L,Y(target),R,Y(target),'#c47b1a',2,[7,5]);function curve(f,col,width){ctx.save();ctx.beginPath();ctx.rect(L,T,R-L,B-T);ctx.clip();ctx.beginPath();let started=false;for(let i=0;i<=900;i++){let x=i/900*2*pi,y=f(x);if(!Number.isFinite(y)||Math.abs(y)>100){started=false;continue}if(started)ctx.lineTo(X(x),Y(y));else{ctx.moveTo(X(x),Y(y));started=true}}ctx.strokeStyle=col;ctx.lineWidth=width;ctx.stroke();ctx.restore()}if(other)curve(other,'#afc0d7',5);curve(fn,'#2856ad',3);points.forEach(x=>{const y=fn(x);ctx.beginPath();ctx.arc(X(x),Y(y),7,0,2*pi);ctx.fillStyle='#208358';ctx.fill()});if(tracer!==null){ctx.beginPath();ctx.arc(X(tracer),Y(fn(tracer)),7,0,2*pi);ctx.fillStyle='#b94e4d';ctx.fill()}text(ctx,'x (radians)',R-90,c.height-7,'#536987',13)}
function showTab(cards){stop();$('demo').hidden=cards;$('flash').hidden=!cards;for(const [id,on] of [['demoTab',!cards],['cardsTab',cards]]){$(id).classList.toggle('active',on);$(id).setAttribute('aria-pressed',on)}}$('demoTab').onclick=()=>showTab(false);$('cardsTab').onclick=()=>showTab(true);
let order=CARDS.map((_,i)=>i),position=0,revealed=false,marks={};
function renderCards(){const c=CARDS[order[position]];$('face').textContent=revealed?'Answer':'Think first';$('cardText').textContent=c[revealed?1:0];$('hint').textContent=revealed?'Click to hide':'Click to reveal';$('flip').textContent=revealed?'Hide answer':'Show answer';$('known').disabled=$('again').disabled=!revealed;$('prev').disabled=position===0;$('next').disabled=position===order.length-1;$('count').textContent=(position+1)+' of '+order.length;const k=Object.values(marks).filter(v=>v==='known').length,m=Object.values(marks).filter(v=>v==='missed').length;$('score').textContent='Got it: '+k+' · Practice again: '+m;$('missed').disabled=m===0;$('card').setAttribute('aria-label',(revealed?'Answer: ':'Question: ')+$('cardText').textContent)}
function flip(){revealed=!revealed;renderCards()}function move(n){position=Math.max(0,Math.min(order.length-1,position+n));revealed=false;renderCards()}function mark(v){if(!revealed)return;marks[order[position]]=v;if(position<order.length-1){position++;revealed=false}renderCards()}
$('card').onclick=$('flip').onclick=flip;$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('known').onclick=()=>mark('known');$('again').onclick=()=>mark('missed');$('reset').onclick=()=>{order=CARDS.map((_,i)=>i);position=0;revealed=false;marks={};renderCards()};$('missed').onclick=()=>{order=CARDS.map((_,i)=>i).filter(i=>marks[i]==='missed');position=0;revealed=false;renderCards()};$('shuffle').onclick=()=>{for(let i=order.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}position=0;revealed=false;renderCards()};renderCards();

function compute(f,a,b,s){const A=rad(a),B=rad(b),direct=Math[f](A+s*B);if(f==='sin')return [direct,Math.sin(A)*Math.cos(B)+s*Math.cos(A)*Math.sin(B)];if(f==='cos')return [direct,Math.cos(A)*Math.cos(B)-s*Math.sin(A)*Math.sin(B)];return [direct,(Math.tan(A)+s*Math.tan(B))/(1-s*Math.tan(A)*Math.tan(B))]}
function render(){const f=$('fn').value,a=Number($('a').value),b=Number($('b').value),s=Number($('sign').value),symbol=s===1?'+':'−',angle=a+s*b;for(const [id,v] of [['aOut',a],['bOut',b]])$(id).textContent=v+'°';circle('plot',[[a,'#7b8ca4','A'],[angle,'#2856ad','A '+symbol+' B']]);let formula=f==='sin'?'sin A cos B '+symbol+' cos A sin B':f==='cos'?'cos A cos B '+(s===1?'−':'+')+' sin A sin B':'(tan A '+symbol+' tan B) / (1 '+(s===1?'−':'+')+' tan A tan B)';$('formula').textContent=f+'(A '+symbol+' B) = '+formula;const [left,right]=compute(f,a,b,s),undefinedResult=f==='tan'&&Math.abs(Math.cos(rad(angle)))<1e-9,invalidExpansion=f==='tan'&&(Math.abs(Math.cos(rad(a)))<1e-9||Math.abs(Math.cos(rad(b)))<1e-9);$('result').textContent=undefinedResult?f+'('+angle+'°) is undefined.':invalidExpansion?f+'('+angle+'°) = '+tidy(left)+'. The tangent expansion cannot be used here because tan A or tan B is undefined.':f+'('+angle+'°) ≈ '+tidy(left)+' · Formula value ≈ '+tidy(right)+'. They agree!';$('exact').textContent=angle===75&&f==='sin'?'Exact: sin 75° = (√6 + √2)/4.':angle===15&&f==='cos'?'Exact: cos 15° = (√6 + √2)/4.':angle===15&&f==='tan'?'Exact: tan 15° = 2 − √3.':'Angles in this explorer use degrees; identities work in radians too.'}['fn','a','b','sign'].forEach(id=>$(id).oninput=render);document.querySelectorAll('[data-preset]').forEach(e=>e.onclick=()=>{$('a').value=45;$('b').value=30;$('sign').value=e.dataset.preset==='75'?1:-1;render()});render();
</script></body></html>
